<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="오늘도 힘내세요! - 밝은 회색 테마 메인 페이지">
    <title>오늘도 힘내세요!</title>
    <!-- Fonts (Pretendard & Noto Sans KR for High Korean Legibility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root,
        body {
            --primary-color: #4ade80;
            --primary-grad: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
            --secondary-color: #064e3b;
            --secondary-grad: linear-gradient(135deg, #064e3b 0%, #022c22 100%);

            --bg-grad: linear-gradient(135deg, #f0fdf4 0%, #e6f4ea 45%, #dcfce7 100%);
            --header-bg: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(134, 239, 172, 0.6);
            --section-title-color: #064e3b;
            --review-card-bg: rgba(255, 255, 255, 0.85);
            --review-card-border: rgba(134, 239, 172, 0.5);
            --review-text-color: #064e3b;
            --review-author-color: #047857;
            --footer-bg: #064e3b;
            --footer-color: #86efac;
            --glow-1: rgba(134, 239, 172, 0.45);
            --glow-2: rgba(52, 211, 153, 0.35);
            --glow-3: rgba(16, 185, 129, 0.3);
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background: var(--bg-grad);
            font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #0f172a;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .app-header {
            width: 100%;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
        }

        .header-logo-icon {
            width: 28px;
            height: 28px;
            color: currentColor;
            transition: transform 0.3s ease;
        }

        .app-header .logo:hover .header-logo-icon {
            transform: rotate(-12deg) scale(1.15);
        }

        .header-nav {
            display: flex;
            gap: 30px;
        }

        .header-nav a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .header-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            padding: 60px 20px;
            gap: 80px;
            z-index: 10;
        }

        .section-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--section-title-color);
            text-align: center;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            transition: color 0.5s ease;
        }

        .review-cards {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .review-card {
            background: var(--review-card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--review-card-border);
            border-radius: 24px;
            padding: 30px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
            display: flex;
            gap: 20px;
            align-items: center;
            transition: background 0.5s ease, border-color 0.5s ease, transform 0.3s ease;
        }

        .review-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.08);
        }

        .review-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .review-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .review-text {
            font-size: 1.05rem;
            color: var(--review-text-color);
            font-weight: 400;
            line-height: 1.6;
            font-style: normal;
            transition: color 0.5s ease;
        }

        .review-author {
            font-size: 0.95rem;
            color: var(--review-author-color);
            font-weight: 600;
            transition: color 0.5s ease;
        }

        .app-footer {
            width: 100%;
            padding: 24px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--footer-color);
            background: var(--footer-bg);
            z-index: 10;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Soft Ambient Glows for Light Grey Gradient */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: float 14s ease-in-out infinite alternate;
            z-index: 1;
        }

        .bg-glow-1 {
            top: 10%;
            left: 15%;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, var(--glow-1) 0%, rgba(0, 0, 0, 0) 70%);
            transition: background 0.5s ease;
        }

        .bg-glow-2 {
            bottom: 10%;
            right: 15%;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, var(--glow-2) 0%, rgba(0, 0, 0, 0) 70%);
            animation-delay: -7s;
            transition: background 0.5s ease;
        }

        .bg-glow-3 {
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, var(--glow-3) 0%, rgba(0, 0, 0, 0) 70%);
            animation-duration: 18s;
            transition: background 0.5s ease;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(35px, -45px) scale(1.1);
            }

            100% {
                transform: translate(-25px, 35px) scale(0.95);
            }
        }

        /* Glassmorphism Card Container for Light Theme */
        .card-container {
            position: relative;
            z-index: 10;
            padding: 4.5rem 6rem;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.08),
                0 10px 30px rgba(148, 163, 184, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            user-select: none;
            max-width: 90vw;
        }

        .card-container:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 40px 90px rgba(15, 23, 42, 0.12),
                0 15px 40px rgba(99, 102, 241, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 1);
        }

        /* Light Theme Badge Tag */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            background: rgba(220, 252, 231, 0.9);
            border: 1px solid rgba(134, 239, 172, 0.9);
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #047857;
            letter-spacing: 0.08em;
            margin-bottom: 2.2rem;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(74, 222, 128, 0.15);
        }

        .badge-dot {
            width: 9px;
            height: 9px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }

        /* Main Heading - 40px Harmonious Charcoal & Indigo Gradient */
        .title {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.25;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #312e81 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 12px rgba(15, 23, 42, 0.08));
            transition: all 0.4s ease;
        }

        .card-container:hover .title {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 50%, #1e1b4b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 20px rgba(99, 102, 241, 0.25));
        }

        /* Subtitle */
        .subtitle {
            margin-top: 1.2rem;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: #475569;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        /* Next Sentence Button (Primary: Light Green, Hover: Secondary Dark Green) */
        .next-btn-container {
            margin-top: 1.8rem;
        }

        .next-btn {
            position: relative;
            z-index: 30;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 42px;
            background: var(--primary-grad);
            color: #064e3b;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            border: 1px solid rgba(134, 239, 172, 0.9);
            border-radius: 9999px;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 10px 25px rgba(74, 222, 128, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
        }

        .next-btn:hover {
            background: var(--secondary-grad);
            color: #ffffff;
            border-color: rgba(6, 78, 59, 0.9);
            transform: translateY(-4px) scale(1.06);
            box-shadow: 0 18px 36px rgba(6, 78, 59, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .next-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .next-btn svg {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .next-btn:hover svg {
            transform: translateX(6px) scale(1.1);
        }

        /* 2-Second Anticipation & Explosion Emotion for '구라임' */
        .title.text-guraim {
            font-size: 54px !important;
            font-weight: 900 !important;
            color: #ef4444 !important;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #991b1b 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            animation: guraimShake 0.25s infinite ease-in-out alternate;
        }

        @keyframes guraimShake {
            0% { transform: scale(1.15) rotate(-3deg); }
            100% { transform: scale(1.22) rotate(3deg); }
        }

        .title.text-exploded {
            animation: guraimExplode 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
        }

        @keyframes guraimExplode {
            0% { transform: scale(1.2); opacity: 1; filter: brightness(1); }
            50% { transform: scale(2.2); opacity: 0.9; filter: brightness(2) drop-shadow(0 0 40px #ef4444); }
            100% { transform: scale(0); opacity: 0; filter: blur(12px); }
        }

        .explode-emoji {
            position: fixed;
            pointer-events: none;
            font-size: 2.5rem;
            z-index: 9999;
            animation: emojiBurst 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes emojiBurst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.8) rotate(180deg);
            }


        /* Pastel Light Particle Effects */
        .particle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #818cf8 0%, #3b82f6 70%, rgba(99, 102, 241, 0) 100%);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(129, 140, 248, 0.6);
            animation: particleAnimation 1s cubic-bezier(0, 0.9, 0.57, 1) forwards;
            z-index: 100;
        }

        @keyframes particleAnimation {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            /* Mobile Responsive Layout (<= 768px) */
            @media (max-width: 768px) {
                .app-header {
                    flex-direction: column;
                    padding: 18px 20px;
                    gap: 14px;
                    text-align: center;
                }

                .header-nav {
                    flex-direction: column;
                    gap: 8px;
                    width: 100%;
                    align-items: center;
                }

                .header-nav a {
                    padding: 10px 20px;
                    background: rgba(255, 255, 255, 0.12);
                    border-radius: 12px;
                    width: 90%;
                    max-width: 280px;
                    text-align: center;
                    font-size: 0.95rem;
                }

                .main-wrapper {
                    padding: 24px 16px;
                    gap: 40px;
                }

                .section-container {
                    gap: 20px;
                }

                .section-title {
                    font-size: 1.4rem;
                }

                .card-container {
                    padding: 2.2rem 1.25rem;
                    border-radius: 24px;
                    width: 100%;
                    max-width: 100%;
                }

                .title {
                    font-size: 23px;
                    line-height: 1.3;
                }

                /* Touch-Friendly Mobile Pill Button (Larger & Extra Spacious) */
                .next-btn {
                    width: 100%;
                    padding: 20px 36px;
                    min-height: 64px;
                    font-size: 1.15rem;
                    font-weight: 800;
                    border-radius: 9999px;
                }

                .review-cards {
                    flex-direction: column;
                    align-items: center;
                    gap: 16px;
                }

                .review-card {
                    width: 100%;
                    max-width: 100%;
                    flex-direction: column;
                    text-align: center;
                    padding: 20px 18px;
                    gap: 12px;
                }

                .review-content {
                    text-align: center;
                }

                .review-text {
                    font-size: 0.95rem;
                    line-height: 1.55;
                }

                .review-author {
                    font-size: 0.88rem;
                }
            }
    </style>
</head>

<body>

    <!-- Ambient Glow Background -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <header class="app-header">
        <div class="logo">
            <svg class="header-logo-icon" width="28" height="28" viewBox="0 0 32 32" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <!-- Hello Kitty Face Outline -->
                <path d="M7 12C4.5 12 3 14.5 3 18.5C3 23 7 26.5 16 26.5C25 26.5 29 23 29 18.5C29 14.5 27.5 12 25 12"
                    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                <!-- Cute Ears -->
                <path d="M5.5 13.5L4 7L10 9.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M26.5 13.5L28 7L22 9.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <!-- Hello Kitty Signature Ribbon / Bow -->
                <path d="M9.5 10.5C9.5 10.5 7.5 8.5 6 10C4.5 11.5 6.5 13.5 6.5 13.5L9.5 10.5Z" fill="currentColor" />
                <path d="M9.5 10.5C9.5 10.5 11.5 8.5 13 10C14.5 11.5 12.5 13.5 12.5 13.5L9.5 10.5Z"
                    fill="currentColor" />
                <circle cx="9.5" cy="10.5" r="1.8" fill="currentColor" />
                <!-- Eyes & Nose -->
                <ellipse cx="11.5" cy="19" rx="1.2" ry="1.8" fill="currentColor" />
                <ellipse cx="20.5" cy="19" rx="1.2" ry="1.8" fill="currentColor" />
                <ellipse cx="16" cy="20.5" rx="1.3" ry="1" fill="currentColor" />
                <!-- Whiskers -->
                <path d="M5 18.5H8M5 20.5H8M24 18.5H27M24 20.5H27" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" />
            </svg>
            <span>나의 첫 서비스</span>
        </div>
        <nav class="header-nav">
            <a href="#">소개</a>
            <a href="#">기능</a>
            <a href="#">문의</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <!-- 핵심 기능 소개 섹션 -->
        <section class="section-container">
            <h2 class="section-title">핵심 기능 소개</h2>
            <main class="card-container" id="mainCard" onclick="nextQuote(event)">
                <div class="badge">
                    <span class="badge-dot"></span>
                    <span id="badgeText">Step 1</span>
                </div>
                <h1 class="title" id="quoteTitle">은율아 사랑해</h1>

                <div class="next-btn-container">
                    <button type="button" class="next-btn" id="nextBtn" onclick="nextQuote(event)">
                        <span>다음 문장 보기</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </main>
        </section>

        <!-- 사용자 후기 섹션 -->
        <section class="section-container">
            <h2 class="section-title">사용자 후기</h2>
            <div class="review-cards">
                <!-- Review 1 -->
                <div class="review-card">
                    <img src="avatar_1.png" alt="사용자 1" class="review-avatar">
                    <div class="review-content">
                        <p class="review-text">"이 서비스 덕분에 매일 긍정적인 에너지를 얻고 있어요. 인터페이스도 너무 예쁩니다!"</p>
                        <span class="review-author">- 김긍정 (디자이너)</span>
                    </div>
                </div>
                <!-- Review 2 -->
                <div class="review-card">
                    <img src="avatar_2.png" alt="사용자 2" class="review-avatar">
                    <div class="review-content">
                        <p class="review-text">"직관적이고 빠릅니다. 처음 써보는데도 헤매지 않고 바로 적응했어요. 강력 추천합니다."</p>
                        <span class="review-author">- 이성실 (개발자)</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="app-footer">
        2025 MY Service
    </footer>

    <script>
        // Quotes List (문장별 개별 버튼 색상 테마 적용)
        const quotes = [
            { title: "은율아 사랑해", badge: "Step 1" },
            { title: "뽀뽀", badge: "Step 2" },
            { title: "쪽쪽쪽", badge: "Step 3" },
            { title: "구라임", badge: "Step 4" }
        ];

        let currentIndex = 0;
        let explodeTimer = null;

        window.nextQuote = function (e) {
            if (e && e.stopPropagation) {
                e.stopPropagation();
            }
            if (explodeTimer) {
                clearTimeout(explodeTimer);
                explodeTimer = null;
            }

            currentIndex = (currentIndex + 1) % quotes.length;
            const currentQuote = quotes[currentIndex];

            const quoteTitle = document.getElementById('quoteTitle');
            const badgeText = document.getElementById('badgeText');

            if (!quoteTitle || !badgeText) return;

            quoteTitle.className = 'title';
            quoteTitle.style.opacity = '0';

            setTimeout(() => {
                quoteTitle.textContent = currentQuote.title;
                badgeText.textContent = currentQuote.badge;
                quoteTitle.style.opacity = '1';



                // '구라임' 등장 시: 글씨 54px 확대 + 1.5초 뒤 💥 뻥 터지는 이모션
                if (currentQuote.title === "구라임") {
                    quoteTitle.classList.add('text-guraim');

                    explodeTimer = setTimeout(() => {
                        quoteTitle.classList.remove('text-guraim');
                        quoteTitle.classList.add('text-exploded');

                        triggerExplosionBurst();

                        // 0.8초 후 자동으로 다시 '은율아 사랑해' (Step 1)로 순환!
                        setTimeout(() => {
                            if (currentIndex === 3) {
                                window.nextQuote();
                            }
                        }, 800);
                    }, 1500);
                }
            }, 150);
        };



        function triggerExplosionBurst() {
            const mainCard = document.getElementById('mainCard');
            if (!mainCard) return;

            const rect = mainCard.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const emojis = ['💥', '💣', '💨', '✨', '🤪', '🔥', '🎉'];
            for (let i = 0; i < 32; i++) {
                const emojiEl = document.createElement('div');
                emojiEl.className = 'explode-emoji';
                emojiEl.textContent = emojis[Math.floor(Math.random() * emojis.length)];

                emojiEl.style.left = `${centerX}px`;
                emojiEl.style.top = `${centerY}px`;

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 280 + 80;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;

                emojiEl.style.setProperty('--tx', `${tx}px`);
                emojiEl.style.setProperty('--ty', `${ty}px`);

                document.body.appendChild(emojiEl);

                setTimeout(() => emojiEl.remove(), 1000);
            }
        }

        const mainCardEl = document.getElementById('mainCard');
        const nextBtnEl = document.getElementById('nextBtn');

        if (mainCardEl) mainCardEl.onclick = window.nextQuote;
        if (nextBtnEl) nextBtnEl.onclick = window.nextQuote;

        // Pastel Light Particle Burst on Click
        document.addEventListener('click', (e) => {
            const x = e.clientX || (window.innerWidth / 2);
            const y = e.clientY || (window.innerHeight / 2);
            for (let i = 0; i < 16; i++) {
                createParticle(x, y);
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 10 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x - size / 2}px`;
            particle.style.top = `${y - size / 2}px`;

            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 140 + 40;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 1000);
        }
    </script>
</body>

</html>
