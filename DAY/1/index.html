<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="내 첫번째 아이디어 - 파란색 테마 메인 페이지">
    <title>내 첫번째 아이디어</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #060b19;
            font-family: 'Noto Sans KR', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* Ambient Blue Background Glows */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.6;
            animation: float 12s ease-in-out infinite alternate;
            z-index: 1;
        }

        .bg-glow-1 {
            top: 15%;
            left: 20%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #1d4ed8 0%, rgba(29, 78, 216, 0) 70%);
        }

        .bg-glow-2 {
            bottom: 15%;
            right: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0284c7 0%, rgba(2, 132, 199, 0) 70%);
            animation-delay: -6s;
        }

        .bg-glow-3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
            animation-duration: 16s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(40px, -50px) scale(1.15);
            }
            100% {
                transform: translate(-30px, 40px) scale(0.9);
            }
        }

        /* Glassmorphism Card Container matched to Blue Tone */
        .card-container {
            position: relative;
            z-index: 10;
            padding: 4rem 5.5rem;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 36px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            box-shadow: 0 35px 80px rgba(2, 6, 23, 0.7),
                        0 0 40px rgba(37, 99, 235, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            user-select: none;
            max-width: 90vw;
        }

        .card-container:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 45px 90px rgba(2, 132, 199, 0.35),
                        0 0 60px rgba(59, 130, 246, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-color: rgba(96, 165, 250, 0.5);
        }

        /* Blue Theme Badge Tag */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.4);
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #93c5fd;
            letter-spacing: 0.08em;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 9px;
            height: 9px;
            background-color: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 12px #60a5fa;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        /* Main Heading - Extra Large & Blue Gradient */
        .title {
            font-size: clamp(3.2rem, 8vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.15;
            background: linear-gradient(135deg, #ffffff 0%, #60a5fa 45%, #2563eb 80%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 25px rgba(37, 99, 235, 0.4));
            transition: all 0.4s ease;
        }

        .card-container:hover .title {
            background: linear-gradient(135deg, #ffffff 0%, #93c5fd 40%, #38bdf8 80%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.6));
        }

        /* Matching Blue Subtitle */
        .subtitle {
            margin-top: 1.5rem;
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            color: #93c5fd;
            font-weight: 400;
            letter-spacing: 0.04em;
            opacity: 0.9;
        }

        /* Blue Particle Effects */
        .particle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #ffffff 0%, #3b82f6 60%, #1d4ed8 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px #60a5fa;
            animation: particleAnimation 1s cubic-bezier(0, 0.9, 0.57, 1) forwards;
            z-index: 100;
        }

        @keyframes particleAnimation {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Blue Glow Background -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Centered Glass Card -->
    <main class="card-container" id="mainCard">
        <div class="badge">
            <span class="badge-dot"></span>
            <span>First Idea</span>
        </div>
        <h1 class="title">내 첫번째 아이디어</h1>
        <p class="subtitle">블루 오션의 첫걸음</p>
    </main>

    <script>
        // Blue Particle Burst on Click
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 16; i++) {
                createParticle(e.clientX, e.clientY);
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 10 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x - size / 2}px`;
            particle.style.top = `${y - size / 2}px`;
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 140 + 40;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }
    </script>
</body>
</html>
