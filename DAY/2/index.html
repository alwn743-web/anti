<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="오늘도 힘내세요! - 밝은 회색 테마 메인 페이지">
    <title>오늘도 힘내세요!</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 45%, #e0e7ff 100%);
            font-family: 'Noto Sans KR', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
            color: #0f172a;
        }

        /* Soft Ambient Glows for Light Grey Gradient */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: float 14s ease-in-out infinite alternate;
            z-index: 1;
        }

        .bg-glow-1 {
            top: 10%;
            left: 15%;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.35) 0%, rgba(96, 165, 250, 0) 70%);
        }

        .bg-glow-2 {
            bottom: 10%;
            right: 15%;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(168, 85, 247, 0) 70%);
            animation-delay: -7s;
        }

        .bg-glow-3 {
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(56, 189, 248, 0) 70%);
            animation-duration: 18s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(35px, -45px) scale(1.1);
            }

            100% {
                transform: translate(-25px, 35px) scale(0.95);
            }
        }

        /* Glassmorphism Card Container for Light Theme */
        .card-container {
            position: relative;
            z-index: 10;
            padding: 4.5rem 6rem;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.08),
                0 10px 30px rgba(148, 163, 184, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            user-select: none;
            max-width: 90vw;
        }

        .card-container:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 40px 90px rgba(15, 23, 42, 0.12),
                0 15px 40px rgba(99, 102, 241, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 1);
        }

        /* Light Theme Badge Tag */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            background: rgba(238, 242, 255, 0.85);
            border: 1px solid rgba(199, 210, 254, 0.8);
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #4f46e5;
            letter-spacing: 0.08em;
            margin-bottom: 2.2rem;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.08);
        }

        .badge-dot {
            width: 9px;
            height: 9px;
            background-color: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }

        /* Main Heading - 40px Harmonious Charcoal & Indigo Gradient */
        .title {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.25;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #312e81 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 12px rgba(15, 23, 42, 0.08));
            transition: all 0.4s ease;
        }

        .card-container:hover .title {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 50%, #1e1b4b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 20px rgba(99, 102, 241, 0.25));
        }

        /* Subtitle */
        .subtitle {
            margin-top: 1.2rem;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: #475569;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        /* Vivid Blue Next Sentence Button */
        .next-btn-container {
            margin-top: 1.8rem;
        }

        .next-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        /* 1. 파란색 버튼 (오늘도 힘내세요!) */
        .next-btn.btn-blue {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .next-btn.btn-blue:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        /* 2. 노란색 버튼 (오늘도 해냈어요!) */
        .next-btn.btn-yellow {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .next-btn.btn-yellow:hover {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 32px rgba(234, 179, 8, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* 3. 주황색 버튼 (조금씩 나아지고 있어요.) */
        .next-btn.btn-orange {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .next-btn.btn-orange:hover {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 32px rgba(249, 115, 22, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* 4. 초록색 버튼 (이대로 계속 가봅시다.) */
        .next-btn.btn-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .next-btn.btn-green:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 32px rgba(16, 185, 129, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .next-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .next-btn svg {
            transition: transform 0.3s ease;
        }

        .next-btn:hover svg {
            transform: translateX(4px);
        }

        /* Title & Subtitle transition */
        .title,
        .subtitle {
            transition: opacity 0.2s ease, background 0.4s ease, filter 0.4s ease;
        }

        /* Pastel Light Particle Effects */
        .particle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #818cf8 0%, #3b82f6 70%, rgba(99, 102, 241, 0) 100%);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(129, 140, 248, 0.6);
            animation: particleAnimation 1s cubic-bezier(0, 0.9, 0.57, 1) forwards;
            z-index: 100;
        }

        @keyframes particleAnimation {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Glow Background -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Centered Glass Card -->
    <main class="card-container" id="mainCard">
        <div class="badge">
            <span class="badge-dot"></span>
            <span id="badgeText">Step 1</span>
        </div>
        <h1 class="title" id="quoteTitle">오늘도 힘내세요!</h1>

        <div class="next-btn-container">
            <button class="next-btn btn-blue" id="nextBtn">
                <span>다음 문장 보기</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </main>

    <script>
        // Quotes List (문장별 개별 버튼 색상 테마 적용)
        const quotes = [
            { title: "오늘도 힘내세요!", badge: "Step 1", themeClass: "btn-blue" },
            { title: "오늘도 해냈어요!", badge: "Step 2", themeClass: "btn-yellow" },
            { title: "조금씩 나아지고 있어요.", badge: "Step 3", themeClass: "btn-orange" },
            { title: "이대로 계속 가봅시다.", badge: "Step 4", themeClass: "btn-green" }
        ];

        let currentIndex = 0;
        const nextBtn = document.getElementById('nextBtn');
        const quoteTitle = document.getElementById('quoteTitle');
        const badgeText = document.getElementById('badgeText');

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 파티클 생성 등 클릭 이벤트 전파 조절
            currentIndex = (currentIndex + 1) % quotes.length;
            const currentQuote = quotes[currentIndex];

            // 버튼 색상 테마 변경
            nextBtn.className = `next-btn ${currentQuote.themeClass}`;

            quoteTitle.style.opacity = '0';

            setTimeout(() => {
                quoteTitle.textContent = currentQuote.title;
                badgeText.textContent = currentQuote.badge;
                quoteTitle.style.opacity = '1';
            }, 200);
        });

        // Pastel Light Particle Burst on Click
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 16; i++) {
                createParticle(e.clientX, e.clientY);
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 10 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x - size / 2}px`;
            particle.style.top = `${y - size / 2}px`;

            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 140 + 40;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 1000);
        }
    </script>
</body>

</html>
